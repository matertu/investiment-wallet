<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e3250" />
  <title>Acinonyx — Aportes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="topbar-left">
        <a href="index.html" class="brand nav-transition">
          <img src="icons/icon-192.png" alt="Logo Acinonyx" class="brand-logo" />
          <span class="brand-text">
            <span class="brand-name">Acinonyx</span>
            <span class="brand-tagline">Aportes &amp; Ativos</span>
          </span>
        </a>
        <nav class="topnav" aria-label="Navegação principal">
          <a href="index.html" class="nav-link">Carteira</a>
          <a href="aportes.html" class="nav-link active">Aportes</a>
          <a href="dashboard.html" class="nav-link">Dashboard</a>
        </nav>
      </div>
      <div class="topbar-actions">
        <button
          id="btn-privacidade"
          class="btn btn-secondary btn-sm btn-icon"
          type="button"
          title="Ocultar ou mostrar valores"
          aria-label="Ocultar valores"
        >
          👁️
        </button>
        <button id="btn-tema" class="btn btn-secondary btn-sm" type="button">
          🌙 Escuro
        </button>
        <button id="btn-recarregar-aportes" class="btn btn-secondary btn-sm" type="button">
          Atualizar
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div>

    <!-- Formulário principal: Registrar / Editar Aporte -->
    <section class="card">
      <div class="section-header">
        <h2 id="titulo-form-aporte">Registrar Aporte</h2>
        <button
          id="btn-cancelar-edicao"
          type="button"
          class="btn btn-ghost btn-sm hidden"
        >
          Cancelar edição
        </button>
      </div>

      <form id="form-aporte">
        <input id="aporte-id" type="hidden" value="" />

        <div class="field-row">
          <div class="field">
            <label for="aporte-ativo">Ativo</label>
            <select id="aporte-ativo" name="ativo_id" required>
              <option value="">Selecione um ativo...</option>
            </select>
          </div>

          <div class="field">
            <label for="aporte-tipo">Operação</label>
            <select id="aporte-tipo" name="tipo" required>
              <option value="APORTE">Aporte</option>
              <option value="RESGATE">Resgate</option>
            </select>
          </div>
        </div>

        <div class="field-row field-row-3">
          <div class="field" id="field-aporte-quantidade">
            <label for="aporte-quantidade">Quantidade</label>
            <input
              id="aporte-quantidade"
              name="quantidade"
              type="number"
              step="any"
              min="0.000001"
              placeholder="Ex: 100"
              required
            />
          </div>

          <div class="field">
            <label for="aporte-valor" id="label-aporte-valor">Valor Unitário (R$)</label>
            <input
              id="aporte-valor"
              name="valor_unitario"
              type="number"
              step="0.0001"
              min="0.0001"
              placeholder="Ex: 28.50"
              required
            />
          </div>

          <div class="field">
            <label for="aporte-data">Data da Operação</label>
            <input id="aporte-data" name="data_aporte" type="date" />
          </div>
        </div>

        <div class="form-actions">
          <button id="btn-submit-aporte" type="submit" class="btn btn-primary">
            Salvar Aporte
          </button>
        </div>
      </form>
    </section>

    <!-- Bloco recolhível: Cadastrar Novo Ativo -->
    <details id="detalhes-novo-ativo" class="card collapsible-card">
      <summary class="collapsible-summary">
        <span>+ Cadastrar Novo Ativo</span>
        <span class="badge-muted">Ação, FII, ETF ou Renda Fixa</span>
      </summary>

      <form id="form-ativo" class="collapsible-body">
        <div class="field-row">
          <div class="field">
            <label for="ativo-codigo">Código</label>
            <input
              id="ativo-codigo"
              name="codigo"
              type="text"
              placeholder="Ex: BBAS3 ou CDB_120"
              maxlength="30"
              required
            />
          </div>

          <div class="field">
            <label for="ativo-classe">Classe</label>
            <select id="ativo-classe" name="classe" required>
              <option value="ACAO">Ação</option>
              <option value="FII">FII</option>
              <option value="ETF">ETF</option>
              <option value="RENDA_FIXA">Renda Fixa</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="ativo-nome">Nome do Ativo</label>
          <input
            id="ativo-nome"
            name="nome"
            type="text"
            placeholder="Ex: Banco do Brasil"
            maxlength="100"
            required
          />
        </div>

        <div id="campos-rf" class="rf-fields hidden">
          <div class="field-row field-row-3">
            <div class="field">
              <label for="ativo-indexador">Indexador</label>
              <select id="ativo-indexador" name="indexador">
                <option value="CDI">CDI</option>
                <option value="SELIC">SELIC</option>
                <option value="IPCA">IPCA</option>
                <option value="PREFIXADO">Prefixado</option>
              </select>
            </div>

            <div class="field">
              <label for="ativo-taxa" id="label-ativo-taxa">Percentual do CDI (%)</label>
              <input
                id="ativo-taxa"
                name="taxa_percentual"
                type="number"
                step="0.01"
                min="0"
                placeholder="Ex: 100 ou 120"
              />
            </div>

            <div class="field">
              <label for="ativo-valor-inicial">Valor Inicial / Atual (R$)</label>
              <input
                id="ativo-valor-inicial"
                name="valor_atual"
                type="number"
                step="0.01"
                min="0"
                value="0"
                placeholder="0,00"
              />
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Cadastrar Ativo</button>
        </div>
      </form>
    </details>

    <!-- Histórico de Aportes com Filtros -->
    <section class="card">
      <div class="section-header">
        <h2>Histórico de Aportes</h2>
        <div class="filter-bar">
          <select id="filtro-ativo" aria-label="Filtrar por ativo">
            <option value="">Todos os ativos</option>
          </select>
          <select id="filtro-tipo" aria-label="Filtrar por operação">
            <option value="">Aportes e Resgates</option>
            <option value="APORTE">Somente Aportes</option>
            <option value="RESGATE">Somente Resgates</option>
          </select>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Ativo</th>
              <th>Tipo</th>
              <th class="num">Qtde</th>
              <th class="num">Valor Unit.</th>
              <th class="num">Total</th>
              <th class="actions-col">Ações</th>
            </tr>
          </thead>
          <tbody id="tbody-aportes">
            <tr>
              <td colspan="7"><span class="skeleton-bar"></span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Navegação inferior fixa no celular (PWA) -->
  <nav class="bottom-nav" aria-label="Navegação mobile">
    <a href="index.html" class="bottom-nav-link">
      <span class="bottom-nav-icon" aria-hidden="true">💼</span>
      <span>Carteira</span>
    </a>
    <a href="aportes.html" class="bottom-nav-link active">
      <span class="bottom-nav-icon" aria-hidden="true">➕</span>
      <span>Aportes</span>
    </a>
    <a href="dashboard.html" class="bottom-nav-link">
      <span class="bottom-nav-icon" aria-hidden="true">📊</span>
      <span>Dashboard</span>
    </a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/aportes.js"></script>
</body>
</html>
